<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="競馬シミュ">
<title>競馬シミュレーター</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A1A; --card:#14122E; --line:#2B2856; --line2:#4A4780;
  --text:#EEEBFF; --mute:#A9A6D6; --mute2:#8C89BD;
  --lime:#C6FF3D; --pink:#FF3D81; --gold:#FFC83D; --aqua:#3DE8FF;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(64px);pointer-events:none;z-index:0}
body::before{top:-90px;right:-80px;background:var(--pink);opacity:.2}
body::after{bottom:-110px;left:-90px;background:var(--lime);opacity:.14}
.view{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;min-height:100dvh}
.view[hidden]{display:none}
.disp{font-family:'Dela Gothic One',sans-serif;font-weight:400}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.mute{color:var(--mute)}
.small{font-size:12px}
.tag{background:var(--lime);color:#0B0A1A;font-weight:900;font-size:12px;padding:4px 10px;border-radius:999px}
.tag-line{font-size:11px;color:var(--mute);border:1px solid var(--line2);padding:3px 8px;border-radius:999px}
.title{font-size:32px;line-height:1.15;margin:2px 0 0;color:#fff;text-shadow:0 0 12px rgba(255,61,129,.8),0 0 30px rgba(255,61,129,.45)}
.sec{font-size:13px;font-weight:700;color:var(--mute);margin:0}
.rank{display:flex;align-items:center;gap:10px;margin-top:8px}
.rank .no{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#0B0A1A;flex:none}
.rank .nm{width:88px;font-size:14px;font-weight:700;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .track{flex:1;height:10px;border-radius:999px;background:#1C1A3A}
.rank .fill{height:10px;border-radius:999px;background:var(--lime);box-shadow:0 0 12px rgba(198,255,61,.7);transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.rank .pc{width:48px;text-align:right;font-size:14px;font-weight:900}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.metric .k{font-size:11px;color:var(--mute)}
.metric .v{font-family:'Dela Gothic One',sans-serif;font-size:19px;margin-top:2px}
.bet{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.bet .lab{width:68px;flex:none}
.bet .lab b{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:16px;display:block}
.bet .lab span{font-size:11px;color:var(--mute)}
.bet .mid{flex:1;min-width:0}
.chips{display:flex;align-items:center;gap:6px}
.chip{width:32px;height:32px;border-radius:50%;border:2px solid var(--lime);color:var(--lime);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
.chip.pk{border-color:var(--pink);color:var(--pink)}
.sep{color:var(--mute);font-weight:900}
.bet .names{font-size:12px;color:var(--mute);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bet .ev{text-align:right;flex:none}
.bet .ev small{display:block;font-size:11px;color:var(--mute)}
.bet .ev b{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:22px;line-height:1.1}
.bet .ev i{display:block;font-style:normal;font-size:11px;color:var(--mute2);margin-top:2px}
.good{color:var(--lime)}
.weak{color:var(--pink)}
.none{color:var(--mute)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border:0;border-radius:14px;background:var(--lime);color:#0B0A1A;font-family:inherit;font-weight:900;font-size:18px;cursor:pointer;position:relative;overflow:hidden;animation:ring 1.8s infinite}
.btn.ghost{background:transparent;border:2px solid var(--lime);color:var(--lime);animation:none;height:50px;font-size:16px}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.foot{font-size:11px;color:var(--mute2);text-align:center;line-height:1.6}
.push{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.err{background:var(--card);border:1px solid var(--pink);border-radius:14px;padding:16px;line-height:1.7;font-size:14px}

.live{width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink);animation:blink 1.2s ease-in-out infinite}
.lanes{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 0}
.lane{position:relative;height:var(--lane);border-bottom:1px dashed var(--line)}
.lane:nth-last-child(2){border-bottom:0}
.runner{position:absolute;left:8px;top:calc((var(--lane) - var(--size)) / 2);width:var(--size);height:var(--size);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0B0A1A;font-size:calc(var(--size) * .46);will-change:transform}
.runner::before{content:"";position:absolute;right:50%;top:50%;width:56px;height:4px;margin-top:-2px;border-radius:999px;background:inherit;opacity:.45;z-index:-1}
.finish{position:absolute;top:0;bottom:0;right:16px;border-right:3px dashed var(--lime)}
.prog{height:8px;border-radius:999px;background:#1C1A3A}
.prog div{height:8px;border-radius:999px;background:var(--pink);box-shadow:0 0 10px rgba(255,61,129,.8);width:0}
.comment{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:12px 16px;box-shadow:0 0 18px rgba(255,200,61,.25)}
.comment small{font-size:11px;color:var(--mute)}
.comment p{margin:4px 0 0;font-family:'Dela Gothic One',sans-serif;font-size:21px;line-height:1.4;color:var(--gold);text-shadow:0 0 12px rgba(255,200,61,.6)}

.hero{text-align:center}
.hero .big{font-family:'Dela Gothic One',sans-serif;font-size:88px;line-height:1.1;margin:2px 0 0}
.hero .big.win{color:var(--gold);animation:pop 1.1s ease-in-out infinite;text-shadow:0 0 16px rgba(255,200,61,.8),0 0 40px rgba(255,200,61,.5)}
.hero .big.part{color:var(--aqua);font-size:56px;text-shadow:0 0 14px rgba(61,232,255,.5)}
.hero .big.lose{color:var(--mute);font-size:64px}
.hero .net{font-family:'Dela Gothic One',sans-serif;font-size:40px;margin-top:2px}
.hero .roi{display:inline-block;margin-top:8px;background:var(--pink);color:#0B0A1A;font-weight:900;font-size:14px;padding:5px 14px;border-radius:999px}
.hero .roi.low{background:var(--line);color:var(--mute)}
.order{display:flex;gap:8px}
.order div{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;font-weight:900}
.order .c{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0B0A1A;font-size:13px}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.ticket .r{display:flex;align-items:center;gap:10px;min-height:42px;border-bottom:1px solid var(--line);font-size:13px}
.ticket .r:last-child{border-bottom:0}
.ticket .k{width:52px;flex:none;font-family:'Dela Gothic One',sans-serif;font-size:14px}
.ticket .n{flex:1;color:var(--mute)}
.ticket .s{font-weight:900;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--lime);color:#0B0A1A}
.ticket .s.miss{background:var(--line);color:var(--mute)}
.ticket .y{width:64px;text-align:right;font-weight:900;font-size:14px}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
#confetti span{position:absolute;top:0;animation:fall linear forwards}

@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(198,255,61,.55)}70%{box-shadow:0 0 0 16px rgba(198,255,61,0)}100%{box-shadow:0 0 0 0 rgba(198,255,61,0)}}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes fall{0%{transform:translateY(-30px) rotate(0)}100%{transform:translateY(110vh) rotate(600deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<section id="v-pick" class="view"><p class="foot">読み込み中…</p></section>
<section id="v-race" class="view" hidden></section>
<section id="v-result" class="view" hidden></section>
</main>
<div id="confetti" aria-hidden="true"></div>

<script>
/*LOGIC_START*/
const CFG = {
  UNIT: 100,
  MIN_P: { tan: 0.05, fuku: 0.20, umaren: 0.03, wide: 0.10 },
  WIDE_SECOND_MIN_EV: 1.0
};

function pairKey(a, b) { return a < b ? a + '-' + b : b + '-' + a; }

function forEachTriple(w, S, cb) {
  const n = w.length;
  for (let a = 0; a < n; a++) {
    const pa = w[a] / S;
    for (let b = 0; b < n; b++) {
      if (b === a) continue;
      const pb = w[b] / (S - w[a]);
      for (let c = 0; c < n; c++) {
        if (c === a || c === b) continue;
        const pc = w[c] / (S - w[a] - w[b]);
        cb(a, b, c, pa * pb * pc);
      }
    }
  }
}

function computeModel(horses) {
  const n = horses.length;
  const w = horses.map(h => Number(h.power));
  const S = w.reduce((x, y) => x + y, 0);
  const win = new Array(n).fill(0);
  const top3 = new Array(n).fill(0);
  const quinella = {};
  const wide = {};
  const add = (o, k, p) => { o[k] = (o[k] || 0) + p; };
  forEachTriple(w, S, (a, b, c, p) => {
    win[a] += p;
    top3[a] += p; top3[b] += p; top3[c] += p;
    add(quinella, pairKey(a, b), p);
    add(wide, pairKey(a, b), p);
    add(wide, pairKey(a, c), p);
    add(wide, pairKey(b, c), p);
  });
  return { n, w, S, win, top3, quinella, wide };
}

function buildOddsMaps(data) {
  const noToIdx = {};
  data.horses.forEach((h, i) => { noToIdx[h.no] = i; });
  const toMap = (list) => {
    const m = {};
    (list || []).forEach(x => {
      const a = noToIdx[x.pair[0]], b = noToIdx[x.pair[1]];
      if (a === undefined || b === undefined) return;
      m[pairKey(a, b)] = Number(x.odds);
    });
    return m;
  };
  return { umaren: toMap(data.umaren), wide: toMap(data.wide) };
}

function makeCand(idx, p, odds) {
  const o = (odds === undefined || odds === null || isNaN(odds)) ? null : Number(odds);
  return { idx, p, odds: o, ev: o === null ? null : p * o };
}

function rankCands(cands, minP) {
  let pool = cands.filter(c => c.p >= minP);
  if (!pool.length) pool = cands.slice();
  const withOdds = pool.filter(c => c.odds !== null);
  if (withOdds.length) pool = withOdds;
  return pool.slice().sort((x, y) => (y.ev !== null ? y.ev : y.p) - (x.ev !== null ? x.ev : x.p));
}

function choosePicks(data, model, maps) {
  const H = data.horses;
  const picks = [];
  const tan = rankCands(H.map((h, i) => makeCand([i], model.win[i], h.tan)), CFG.MIN_P.tan)[0];
  if (tan) picks.push(Object.assign({ type: 'tan', label: '単勝', unit: '1点' }, tan));
  const fuku = rankCands(H.map((h, i) => makeCand([i], model.top3[i], h.fuku)), CFG.MIN_P.fuku)[0];
  if (fuku) picks.push(Object.assign({ type: 'fuku', label: '複勝', unit: '1点' }, fuku));
  const um = Object.keys(model.quinella).map(k => {
    const [a, b] = k.split('-').map(Number);
    return makeCand([a, b], model.quinella[k], maps.umaren[k]);
  });
  const umBest = rankCands(um, CFG.MIN_P.umaren)[0];
  if (umBest) picks.push(Object.assign({ type: 'umaren', label: '馬連', unit: '1点' }, umBest));
  const wd = Object.keys(model.wide).map(k => {
    const [a, b] = k.split('-').map(Number);
    return makeCand([a, b], model.wide[k], maps.wide[k]);
  });
  const wdRank = rankCands(wd, CFG.MIN_P.wide);
  if (wdRank[0]) picks.push(Object.assign({ type: 'wide', label: 'ワイド', unit: '1点目' }, wdRank[0]));
  if (wdRank[1] && wdRank[1].ev !== null && wdRank[1].ev >= CFG.WIDE_SECOND_MIN_EV) {
    picks.push(Object.assign({ type: 'wide', label: 'ワイド', unit: '2点目' }, wdRank[1]));
  }
  return picks;
}

function isHit(pick, order) {
  const f = order[0], s = order[1];
  const top3 = order.slice(0, 3);
  if (pick.type === 'tan') return f === pick.idx[0];
  if (pick.type === 'fuku') return top3.indexOf(pick.idx[0]) >= 0;
  if (pick.type === 'umaren') return (f === pick.idx[0] && s === pick.idx[1]) || (f === pick.idx[1] && s === pick.idx[0]);
  if (pick.type === 'wide') return top3.indexOf(pick.idx[0]) >= 0 && top3.indexOf(pick.idx[1]) >= 0;
  return false;
}

function summarize(picks, model) {
  let anyHit = 0, expBack = 0;
  forEachTriple(model.w, model.S, (a, b, c, p) => {
    const order = [a, b, c];
    let hit = false, back = 0;
    picks.forEach(pk => {
      if (isHit(pk, order)) { hit = true; back += pk.odds !== null ? pk.odds * CFG.UNIT : 0; }
    });
    if (hit) anyHit += p;
    expBack += p * back;
  });
  const cost = picks.length * CFG.UNIT;
  const allOdds = picks.every(pk => pk.odds !== null);
  return { anyHit, cost, roi: allOdds && cost ? expBack / cost : null, goodCount: picks.filter(pk => pk.ev !== null && pk.ev >= 1).length };
}

function sampleOrder(w, rnd) {
  const r = rnd || Math.random;
  const pool = w.map((_, i) => i);
  const order = [];
  while (pool.length) {
    let sum = 0;
    pool.forEach(i => { sum += w[i]; });
    let x = r() * sum, pick = pool.length - 1;
    for (let k = 0; k < pool.length; k++) {
      x -= w[pool[k]];
      if (x <= 0) { pick = k; break; }
    }
    order.push(pool.splice(pick, 1)[0]);
  }
  return order;
}

function validateData(data) {
  if (!data || !Array.isArray(data.horses) || data.horses.length < 3) return 'horses が3頭以上ありません。';
  for (const h of data.horses) {
    if (typeof h.no !== 'number' || !h.name || !(Number(h.power) > 0)) return '馬の no / name / power（0より大きい数）を確認してください。';
  }
  return '';
}
/*LOGIC_END*/

const COLORS = ['#C6FF3D', '#FF3D81', '#FFC83D', '#3DE8FF', '#A78BFF', '#FF8A3D', '#EEEBFF', '#3DFFB0'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = (n) => Math.round(n).toLocaleString('ja-JP') + '円';
const pct = (x, d) => (x * 100).toFixed(d === undefined ? 1 : d) + '%';
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let DATA = null, MODEL = null, MAPS = null, PICKS = [], SUMMARY = null, SAMPLE = [], raf = 0;

function show(id) {
  ['v-pick', 'v-race', 'v-result'].forEach(v => { $(v).hidden = (v !== id); });
  if (id !== 'v-result') $('confetti').innerHTML = '';
  window.scrollTo(0, 0);
}

function nameOf(i) { return DATA.horses[i].name; }
function noOf(i) { return DATA.horses[i].no; }
function colorOf(i) { return COLORS[i % COLORS.length]; }

function chips(idx, cls) {
  return idx.map(i => '<span class="chip ' + (cls || '') + '">' + noOf(i) + '</span>').join('<span class="sep">−</span>');
}

function renderPick() {
  const H = DATA.horses;
  const order = H.map((_, i) => i).sort((a, b) => MODEL.win[b] - MODEL.win[a]).slice(0, 3);
  const maxWin = MODEL.win[order[0]];
  const medal = ['#FFC83D', '#FF3D81', '#EEEBFF'];
  const rank = order.map((i, r) =>
    '<div class="rank"><span class="no" style="background:' + medal[r] + '">' + noOf(i) + '</span>' +
    '<span class="nm">' + esc(nameOf(i)) + '</span>' +
    '<div class="track"><div class="fill" style="width:' + (MODEL.win[i] / maxWin * 100).toFixed(1) + '%;animation-delay:' + (r * 0.15) + 's;opacity:' + (1 - r * 0.18) + '"></div></div>' +
    '<span class="pc" style="color:' + (r === 0 ? 'var(--lime)' : 'var(--text)') + '">' + pct(MODEL.win[i]) + '</span></div>'
  ).join('');

  const bets = PICKS.map((pk, k) => {
    const evTxt = pk.ev === null ? '—' : pk.ev.toFixed(2);
    const evCls = pk.ev === null ? 'none' : (pk.ev >= 1 ? 'good' : 'weak');
    const wideCls = pk.type === 'wide' ? 'pk' : '';
    return '<article class="bet"><div class="lab"><b>' + pk.label + '</b><span>' + pk.unit + '</span></div>' +
      '<div class="mid"><div class="chips">' + chips(pk.idx, wideCls) + '</div>' +
      '<div class="names">' + pk.idx.map(i => esc(nameOf(i))).join(' / ') + '</div></div>' +
      '<div class="ev"><small>期待値</small><b class="' + evCls + '">' + evTxt + '</b><i>的中率 ' + pct(pk.p) + '</i></div></article>';
  }).join('');

  $('v-pick').innerHTML =
    '<div class="row between"><div class="row" style="gap:8px"><span class="tag">' + esc(DATA.race || 'レース') + '</span><span class="mute small">' + esc(DATA.course || '') + ' ・ ' + H.length + '頭立て</span></div>' +
    (DATA.sample ? '<span class="tag-line">SAMPLE</span>' : '<span class="tag-line">' + esc(DATA.date || '') + '</span>') + '</div>' +
    '<div><div class="small mute">今日の予想</div><h1 class="title disp">今日の買い目</h1></div>' +
    '<div><p class="sec">勝率ランキング</p>' + rank + '</div>' +
    '<div class="metrics">' +
    '<div class="metric"><div class="k">的中率</div><div class="v">' + pct(SUMMARY.anyHit, 1) + '</div></div>' +
    '<div class="metric"><div class="k">購入金額</div><div class="v">' + SUMMARY.cost.toLocaleString('ja-JP') + '円</div></div>' +
    '<div class="metric"><div class="k">期待回収率</div><div class="v ' + (SUMMARY.roi === null ? 'none' : (SUMMARY.roi >= 1 ? 'good' : 'weak')) + '">' + (SUMMARY.roi === null ? '—' : Math.round(SUMMARY.roi * 100) + '%') + '</div></div>' +
    '</div>' +
    '<div><div class="row between"><p class="sec">買い目</p><span class="small mute">期待値1超 ' + SUMMARY.goodCount + '/' + PICKS.length + '点</span></div>' + bets + '</div>' +
    (DATA.note ? '<p class="foot" style="text-align:left">' + esc(DATA.note) + '</p>' : '') +
    '<div class="push"><button class="btn" data-act="race">レースを見る</button>' +
    '<p class="foot">確率は能力値から計算した値で、期待値は 的中率 × オッズ です。1を超えても的中や回収を約束するものではありません。</p></div>';
}

function startRace() {
  cancelAnimationFrame(raf);
  const H = DATA.horses, n = H.length;
  SAMPLE = sampleOrder(MODEL.w);
  const laneH = Math.max(24, Math.min(46, Math.floor(400 / n)));
  const size = laneH - 8;
  const lanes = H.map((h, i) =>
    '<div class="lane"><div class="runner" id="run' + i + '" style="background:' + colorOf(i) + ';box-shadow:0 0 12px ' + colorOf(i) + '">' + h.no + '</div></div>'
  ).join('');
  $('v-race').innerHTML =
    '<div class="row between"><div class="row" style="gap:8px"><span class="live"></span><span class="disp" style="font-size:18px;letter-spacing:.08em">LIVE</span></div><span class="mute small">' + esc(DATA.race || '') + ' ・ ' + esc(DATA.course || '') + '</span></div>' +
    '<div class="lanes" id="lanes" style="--lane:' + laneH + 'px;--size:' + size + 'px">' + lanes + '<div class="finish"></div></div>' +
    '<div class="prog"><div id="prog"></div></div>' +
    '<div class="comment"><small>実況</small><p id="say">スタート</p></div>' +
    '<div class="push"><button class="btn ghost" data-act="skip">結果へスキップ</button><p class="foot">確率にもとづく1回分のシミュレーションです。実際のレース結果ではありません。</p></div>';
  show('v-race');
  if (reduce) { showResult(); return; }

  const rank = new Array(n);
  SAMPLE.forEach((idx, r) => { rank[idx] = r; });
  const F = H.map((_, i) => 6 + rank[i] * 0.22 + Math.random() * 0.08);
  const phase = H.map(() => Math.random() * 6.28);
  const amp = H.map(() => 0.05 + Math.random() * 0.05);
  const runners = H.map((_, i) => $('run' + i));
  const trackW = $('lanes').clientWidth;
  const travel = Math.max(10, trackW - 16 - 8 - size);
  const endAt = F[SAMPLE[2]] + 1.4;
  const say = $('say'), prog = $('prog');
  const t0 = performance.now();

  function frame(now) {
    const t = (now - t0) / 1000;
    let leader = 0, lx = -1;
    for (let i = 0; i < n; i++) {
      const u = Math.min(1, t / F[i]);
      let x = u < 1 ? u + amp[i] * Math.sin(u * 9.4 + phase[i]) * (1 - u) : 1;
      x = Math.min(1, Math.max(0, x));
      runners[i].style.transform = 'translateX(' + (x * travel).toFixed(1) + 'px)';
      if (x > lx) { lx = x; leader = i; }
    }
    prog.style.width = (lx * 100).toFixed(1) + '%';
    if (t >= F[SAMPLE[0]]) say.textContent = 'ゴール！ 1着は ' + noOf(SAMPLE[0]) + '番';
    else if (lx > 0.8) say.textContent = '最後の直線、' + noOf(leader) + '番が先頭';
    else if (t > 1) say.textContent = '先頭は ' + noOf(leader) + '番 ' + nameOf(leader);
    if (t >= endAt) { showResult(); return; }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
}

function confetti() {
  const box = $('confetti');
  box.innerHTML = '';
  if (reduce) return;
  for (let i = 0; i < 44; i++) {
    const s = document.createElement('span');
    s.style.left = (Math.random() * 100) + '%';
    s.style.width = (6 + Math.random() * 5) + 'px';
    s.style.height = (8 + Math.random() * 8) + 'px';
    s.style.background = COLORS[i % COLORS.length];
    s.style.animationDuration = (3 + Math.random() * 3) + 's';
    s.style.animationDelay = (-Math.random() * 3) + 's';
    box.appendChild(s);
  }
  setTimeout(() => { box.innerHTML = ''; }, 6500);
}

function showResult() {
  cancelAnimationFrame(raf);
  const rows = PICKS.map(pk => {
    const hit = isHit(pk, SAMPLE);
    return { pk, hit, pay: hit && pk.odds !== null ? Math.round(pk.odds * CFG.UNIT) : 0 };
  });
  const cost = PICKS.length * CFG.UNIT;
  const back = rows.reduce((s, r) => s + r.pay, 0);
  const net = back - cost;
  const anyHit = rows.some(r => r.hit);
  const state = net > 0 ? 'win' : (anyHit ? 'part' : 'lose');
  const roi = cost ? Math.round(back / cost * 100) : 0;
  const netTxt = (net >= 0 ? '+' : '−') + Math.abs(net).toLocaleString('ja-JP') + '円';
  const medal = ['var(--gold)', 'var(--lime)', 'var(--aqua)'];
  const order = [0, 1, 2].map(r =>
    '<div><span style="color:' + medal[r] + '">' + (r + 1) + '着</span><span class="c" style="background:' + medal[r] + '">' + noOf(SAMPLE[r]) + '</span></div>'
  ).join('');
  const list = rows.map(r =>
    '<div class="r"><span class="k">' + r.pk.label + '</span><span class="n">' + r.pk.idx.map(noOf).join(' − ') + '</span>' +
    '<span class="s ' + (r.hit ? '' : 'miss') + '">' + (r.hit ? '的中' : 'ハズレ') + '</span>' +
    '<span class="y" style="color:' + (r.hit ? 'var(--lime)' : 'var(--mute)') + '">' + yen(r.pay) + '</span></div>'
  ).join('');

  $('v-result').innerHTML =
    '<div class="hero"><div class="small mute">' + esc(DATA.race || '') + ' シミュレーション結果</div>' +
    '<div class="big ' + state + ' disp">' + (state === 'win' ? '的中' : (state === 'part' ? '一部的中' : 'ハズレ')) + '</div>' +
    '<div class="net ' + (net >= 0 ? 'good' : 'none') + '">' + netTxt + '</div>' +
    '<span class="roi ' + (roi >= 100 ? '' : 'low') + '">回収率 ' + roi + '%</span></div>' +
    '<div class="order">' + order + '</div>' +
    '<div class="ticket">' + list + '</div>' +
    '<p class="foot">購入' + yen(cost) + ' ・ 払戻' + yen(back) + '<br>確率にもとづく1回分の結果で、実際のレース結果ではありません。</p>' +
    '<div class="push"><button class="btn" data-act="race">もう1回走らせる</button><button class="btn ghost" data-act="pick">予想に戻る</button></div>';
  show('v-result');
  if (state === 'win') confetti();
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || !DATA) return;
  const act = b.getAttribute('data-act');
  if (act === 'race') startRace();
  else if (act === 'skip') showResult();
  else if (act === 'pick') show('v-pick');
});

async function boot() {
  try {
    const res = await fetch('race.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
  } catch (e) {
    $('v-pick').innerHTML = '<div class="err">race.json を読み込めませんでした。<br>・ファイル名が race.json になっているか<br>・index.html と同じ場所に置いてあるか<br>・GitHub Pages のURLから開いているか（ダブルクリックで開くと読めません）</div>';
    return;
  }
  const bad = validateData(DATA);
  if (bad) { $('v-pick').innerHTML = '<div class="err">race.json の内容を確認してください。<br>' + esc(bad) + '</div>'; DATA = null; return; }
  MODEL = computeModel(DATA.horses);
  MAPS = buildOddsMaps(DATA);
  PICKS = choosePicks(DATA, MODEL, MAPS);
  SUMMARY = summarize(PICKS, MODEL);
  renderPick();
}
boot();
</script>
