<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="競馬シミュ">
<title>競馬シミュレーター</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A1A; --card:#14122E; --line:#2B2856; --line2:#4A4780;
  --text:#EEEBFF; --mute:#A9A6D6; --mute2:#8C89BD;
  --lime:#C6FF3D; --pink:#FF3D81; --gold:#FFC83D; --aqua:#3DE8FF;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(64px);pointer-events:none;z-index:0}
body::before{top:-90px;right:-80px;background:var(--pink);opacity:.2}
body::after{bottom:-110px;left:-90px;background:var(--lime);opacity:.14}
.view{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;min-height:100dvh}
.view[hidden]{display:none}
.disp{font-family:'Dela Gothic One',sans-serif;font-weight:400}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.mute{color:var(--mute)}
.small{font-size:12px}
.tag{background:var(--lime);color:#0B0A1A;font-weight:900;font-size:12px;padding:4px 10px;border-radius:999px}
.tag-line{font-size:11px;color:var(--mute);border:1px solid var(--line2);padding:3px 8px;border-radius:999px}
.title{font-size:32px;line-height:1.15;margin:2px 0 0;color:#fff;text-shadow:0 0 12px rgba(255,61,129,.8),0 0 30px rgba(255,61,129,.45)}
.sec{font-size:13px;font-weight:700;color:var(--mute);margin:0}
.rank{display:flex;align-items:center;gap:10px;margin-top:8px}
.rank .no{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#0B0A1A;flex:none}
.rank .nm{width:88px;font-size:14px;font-weight:700;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .track{flex:1;height:10px;border-radius:999px;background:#1C1A3A}
.rank .fill{height:10px;border-radius:999px;background:var(--lime);box-shadow:0 0 12px rgba(198,255,61,.7);transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.rank .pc{width:48px;text-align:right;font-size:14px;font-weight:900}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.metric .k{font-size:11px;color:var(--mute)}
.metric .v{font-family:'Dela Gothic One',sans-serif;font-size:19px;margin-top:2px}
.bet{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.bet .lab{width:68px;flex:none}
.bet .lab b{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:16px;display:block}
.bet .lab span{font-size:11px;color:var(--mute)}
.bet .mid{flex:1;min-width:0}
.chips{display:flex;align-items:center;gap:6px}
.chip{width:32px;height:32px;border-radius:50%;border:2px solid var(--lime);color:var(--lime);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
.chip.pk{border-color:var(--pink);color:var(--pink)}
.sep{color:var(--mute);font-weight:900}
.bet .names{font-size:12px;color:var(--mute);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bet .ev{text-align:right;flex:none}
.bet .ev small{display:block;font-size:11px;color:var(--mute)}
.bet .ev b{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:22px;line-height:1.1}
.bet .ev i{display:block;font-style:normal;font-size:11px;color:var(--mute2);margin-top:2px}
.good{color:var(--lime)}
.weak{color:var(--pink)}
.none{color:var(--mute)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border:0;border-radius:14px;background:var(--lime);color:#0B0A1A;font-family:inherit;font-weight:900;font-size:18px;cursor:pointer;animation:ring 1.8s infinite}
.btn.ghost{background:var(--card);border:2px solid var(--lime);color:var(--lime);animation:none;height:46px;font-size:15px}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:default;animation:none}
.foot{font-size:11px;color:var(--mute2);text-align:center;line-height:1.6;margin:0}
.push{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.err{background:var(--card);border:1px solid var(--pink);border-radius:14px;padding:16px;line-height:1.7;font-size:14px}
.races{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.races::-webkit-scrollbar{display:none}
.rc{flex:none;border:1px solid var(--line2);background:var(--card);color:var(--text);font-family:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer}
.rc[aria-pressed="true"]{background:var(--lime);color:#0B0A1A;border-color:var(--lime);font-weight:900}
.rc:focus-visible{outline:2px solid #fff;outline-offset:2px}

.back{background:none;border:0;color:var(--mute);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:6px 0}
.back:focus-visible{outline:2px solid #fff;outline-offset:2px}
.lanes{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 0}
.lane{position:relative;height:var(--lane);border-bottom:1px dashed var(--line)}
.lane:nth-last-child(2){border-bottom:0}
.runner{position:absolute;left:8px;top:calc((var(--lane) - var(--size)) / 2);width:var(--size);height:var(--size);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0B0A1A;font-size:calc(var(--size) * .5);will-change:transform}
.runner::before{content:"";position:absolute;right:50%;top:50%;width:48px;height:3px;margin-top:-1.5px;border-radius:999px;background:inherit;opacity:.45;z-index:-1}
.finish{position:absolute;top:0;bottom:0;right:16px;border-right:3px dashed var(--lime)}
.say{margin:-6px 0 0;text-align:center;font-family:'Dela Gothic One',sans-serif;font-size:16px;color:var(--gold);text-shadow:0 0 10px rgba(255,200,61,.5);min-height:24px}
.last{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;min-height:54px;font-size:13px;flex-wrap:wrap}
.last .c{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:12px}
.last .c i{font-style:normal;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#0B0A1A;font-size:12px}
.last .st{margin-left:auto;font-family:'Dela Gothic One',sans-serif;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat .k{font-size:11px;color:var(--mute)}
.stat .v{font-family:'Dela Gothic One',sans-serif;font-size:26px;line-height:1.25;margin-top:2px}
.stat .s{font-size:11px;color:var(--mute2)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.chart svg{display:block;width:100%;height:auto;margin-top:6px}
.per{display:flex;align-items:center;gap:8px;min-height:40px;border-bottom:1px solid var(--line);font-size:13px}
.per:last-child{border-bottom:0}
.per .k{width:48px;flex:none;font-family:'Dela Gothic One',sans-serif;font-size:13px}
.per .n{flex:1;color:var(--mute)}
.per .h{width:104px;text-align:right;color:var(--mute);font-size:12px;white-space:nowrap}
.per .y{width:52px;text-align:right;font-weight:900}
.pertable{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin-top:8px}
.dock{position:sticky;bottom:0;margin:auto -18px 0;padding:12px 18px calc(6px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.dock .runs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dock .reset{background:none;border:0;color:var(--mute2);font-family:inherit;font-size:12px;cursor:pointer;padding:4px}
#toast{position:fixed;left:50%;bottom:calc(190px + env(safe-area-inset-bottom));transform:translate(-50%,10px);opacity:0;background:var(--lime);color:#0B0A1A;font-family:'Dela Gothic One',sans-serif;font-size:24px;padding:8px 22px;border-radius:999px;z-index:5;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 0 24px rgba(198,255,61,.6)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.neg{background:var(--card);color:var(--mute);border:1px solid var(--line2);box-shadow:none}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
#confetti span{position:absolute;top:0;animation:fall linear forwards}

@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(198,255,61,.55)}70%{box-shadow:0 0 0 16px rgba(198,255,61,0)}100%{box-shadow:0 0 0 0 rgba(198,255,61,0)}}
@keyframes fall{0%{transform:translateY(-30px) rotate(0)}100%{transform:translateY(110vh) rotate(600deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<section id="v-pick" class="view"><p class="foot">読み込み中…</p></section>
<section id="v-sim" class="view" hidden></section>
</main>
<div id="toast" aria-live="polite"></div>
<div id="confetti" aria-hidden="true"></div>

<script>
/*LOGIC_START*/
const CFG = {
  UNIT: 100,
  MIN_P: { tan: 0.05, fuku: 0.20, umaren: 0.03, wide: 0.10 },
  WIDE_SECOND_MIN_EV: 1.0
};

function pairKey(a, b) { return a < b ? a + '-' + b : b + '-' + a; }

function forEachTriple(w, S, cb) {
  const n = w.length;
  for (let a = 0; a < n; a++) {
    const pa = w[a] / S;
    for (let b = 0; b < n; b++) {
      if (b === a) continue;
      const pb = w[b] / (S - w[a]);
      for (let c = 0; c < n; c++) {
        if (c === a || c === b) continue;
        const pc = w[c] / (S - w[a] - w[b]);
        cb(a, b, c, pa * pb * pc);
      }
    }
  }
}

function computeModel(horses) {
  const n = horses.length;
  const w = horses.map(h => Number(h.power));
  const S = w.reduce((x, y) => x + y, 0);
  const win = new Array(n).fill(0);
  const top3 = new Array(n).fill(0);
  const quinella = {};
  const wide = {};
  const add = (o, k, p) => { o[k] = (o[k] || 0) + p; };
  forEachTriple(w, S, (a, b, c, p) => {
    win[a] += p;
    top3[a] += p; top3[b] += p; top3[c] += p;
    add(quinella, pairKey(a, b), p);
    add(wide, pairKey(a, b), p);
    add(wide, pairKey(a, c), p);
    add(wide, pairKey(b, c), p);
  });
  return { n, w, S, win, top3, quinella, wide };
}

function buildOddsMaps(data) {
  const noToIdx = {};
  data.horses.forEach((h, i) => { noToIdx[h.no] = i; });
  const toMap = (list) => {
    const m = {};
    (list || []).forEach(x => {
      const a = noToIdx[x.pair[0]], b = noToIdx[x.pair[1]];
      if (a === undefined || b === undefined) return;
      m[pairKey(a, b)] = Number(x.odds);
    });
    return m;
  };
  return { umaren: toMap(data.umaren), wide: toMap(data.wide) };
}

function makeCand(idx, p, odds) {
  const o = (odds === undefined || odds === null || isNaN(odds)) ? null : Number(odds);
  return { idx, p, odds: o, ev: o === null ? null : p * o };
}

function rankCands(cands, minP) {
  let pool = cands.filter(c => c.p >= minP);
  if (!pool.length) pool = cands.slice();
  const withOdds = pool.filter(c => c.odds !== null);
  if (withOdds.length) pool = withOdds;
  return pool.slice().sort((x, y) => (y.ev !== null ? y.ev : y.p) - (x.ev !== null ? x.ev : x.p));
}

function choosePicks(data, model, maps) {
  const H = data.horses;
  const picks = [];
  const tan = rankCands(H.map((h, i) => makeCand([i], model.win[i], h.tan)), CFG.MIN_P.tan)[0];
  if (tan) picks.push(Object.assign({ type: 'tan', label: '単勝', unit: '1点' }, tan));
  const fuku = rankCands(H.map((h, i) => makeCand([i], model.top3[i], h.fuku)), CFG.MIN_P.fuku)[0];
  if (fuku) picks.push(Object.assign({ type: 'fuku', label: '複勝', unit: '1点' }, fuku));
  const um = Object.keys(model.quinella).map(k => {
    const [a, b] = k.split('-').map(Number);
    return makeCand([a, b], model.quinella[k], maps.umaren[k]);
  });
  const umBest = rankCands(um, CFG.MIN_P.umaren)[0];
  if (umBest) picks.push(Object.assign({ type: 'umaren', label: '馬連', unit: '1点' }, umBest));
  const wd = Object.keys(model.wide).map(k => {
    const [a, b] = k.split('-').map(Number);
    return makeCand([a, b], model.wide[k], maps.wide[k]);
  });
  const wdRank = rankCands(wd, CFG.MIN_P.wide);
  if (wdRank[0]) picks.push(Object.assign({ type: 'wide', label: 'ワイド', unit: '1点目' }, wdRank[0]));
  if (wdRank[1] && wdRank[1].ev !== null && wdRank[1].ev >= CFG.WIDE_SECOND_MIN_EV) {
    picks.push(Object.assign({ type: 'wide', label: 'ワイド', unit: '2点目' }, wdRank[1]));
  }
  return picks;
}

function isHit(pick, order) {
  const f = order[0], s = order[1];
  const top3 = order.slice(0, 3);
  if (pick.type === 'tan') return f === pick.idx[0];
  if (pick.type === 'fuku') return top3.indexOf(pick.idx[0]) >= 0;
  if (pick.type === 'umaren') return (f === pick.idx[0] && s === pick.idx[1]) || (f === pick.idx[1] && s === pick.idx[0]);
  if (pick.type === 'wide') return top3.indexOf(pick.idx[0]) >= 0 && top3.indexOf(pick.idx[1]) >= 0;
  return false;
}

function summarize(picks, model) {
  let anyHit = 0, expBack = 0;
  forEachTriple(model.w, model.S, (a, b, c, p) => {
    const order = [a, b, c];
    let hit = false, back = 0;
    picks.forEach(pk => {
      if (isHit(pk, order)) { hit = true; back += pk.odds !== null ? pk.odds * CFG.UNIT : 0; }
    });
    if (hit) anyHit += p;
    expBack += p * back;
  });
  const cost = picks.length * CFG.UNIT;
  const allOdds = picks.every(pk => pk.odds !== null);
  return { anyHit, cost, roi: allOdds && cost ? expBack / cost : null, goodCount: picks.filter(pk => pk.ev !== null && pk.ev >= 1).length };
}

function sampleOrder(w, rnd) {
  const r = rnd || Math.random;
  const pool = w.map((_, i) => i);
  const order = [];
  while (pool.length) {
    let sum = 0;
    pool.forEach(i => { sum += w[i]; });
    let x = r() * sum, pick = pool.length - 1;
    for (let k = 0; k < pool.length; k++) {
      x -= w[pool[k]];
      if (x <= 0) { pick = k; break; }
    }
    order.push(pool.splice(pick, 1)[0]);
  }
  return order;
}

function validateData(data) {
  if (!data || !Array.isArray(data.horses) || data.horses.length < 3) return 'horses が3頭以上ありません。';
  for (const h of data.horses) {
    if (typeof h.no !== 'number' || !h.name || !(Number(h.power) > 0)) return '馬の no / name / power（0より大きい数）を確認してください。';
  }
  return '';
}
/*LOGIC_END*/

const COLORS = ['#C6FF3D', '#FF3D81', '#FFC83D', '#3DE8FF', '#A78BFF', '#FF8A3D', '#EEEBFF', '#3DFFB0'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = (n) => Math.round(n).toLocaleString('ja-JP') + '円';
const sgn = (n) => (n >= 0 ? '+' : '−') + Math.abs(Math.round(n)).toLocaleString('ja-JP') + '円';
const pct = (x, d) => (x * 100).toFixed(d === undefined ? 1 : d) + '%';
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let ROOT = null, RACES = [], CUR = 0;
let DATA = null, MODEL = null, MAPS = null, PICKS = [], SUMMARY = null;
let SIM = null, busy = false, raf = 0, toastTimer = 0;

function show(id) {
  ['v-pick', 'v-sim'].forEach(v => { $(v).hidden = (v !== id); });
  if (id !== 'v-sim') $('confetti').innerHTML = '';
  window.scrollTo(0, 0);
}

function nameOf(i) { return DATA.horses[i].name; }
function noOf(i) { return DATA.horses[i].no; }
function colorOf(i) { return COLORS[i % COLORS.length]; }

function chips(idx, cls) {
  return idx.map(i => '<span class="chip ' + (cls || '') + '">' + noOf(i) + '</span>').join('<span class="sep">−</span>');
}

function raceChips() {
  if (RACES.length < 2) return '';
  return '<div class="races" role="group" aria-label="レース選択">' + RACES.map((r, i) =>
    '<button class="rc" data-act="pickrace" data-i="' + i + '" aria-pressed="' + (i === CUR) + '">' + esc(r.race || ((i + 1) + 'R')) + '</button>'
  ).join('') + '</div>';
}

function renderPick() {
  const H = DATA.horses;
  const order = H.map((_, i) => i).sort((a, b) => MODEL.win[b] - MODEL.win[a]).slice(0, 3);
  const maxWin = MODEL.win[order[0]];
  const medal = ['#FFC83D', '#FF3D81', '#EEEBFF'];
  const rank = order.map((i, r) =>
    '<div class="rank"><span class="no" style="background:' + medal[r] + '">' + noOf(i) + '</span>' +
    '<span class="nm">' + esc(nameOf(i)) + '</span>' +
    '<div class="track"><div class="fill" style="width:' + (MODEL.win[i] / maxWin * 100).toFixed(1) + '%;animation-delay:' + (r * 0.15) + 's;opacity:' + (1 - r * 0.18) + '"></div></div>' +
    '<span class="pc" style="color:' + (r === 0 ? 'var(--lime)' : 'var(--text)') + '">' + pct(MODEL.win[i]) + '</span></div>'
  ).join('');

  const bets = PICKS.map((pk) => {
    const evTxt = pk.ev === null ? '—' : pk.ev.toFixed(2);
    const evCls = pk.ev === null ? 'none' : (pk.ev >= 1 ? 'good' : 'weak');
    const wideCls = pk.type === 'wide' ? 'pk' : '';
    return '<article class="bet"><div class="lab"><b>' + pk.label + '</b><span>' + pk.unit + '</span></div>' +
      '<div class="mid"><div class="chips">' + chips(pk.idx, wideCls) + '</div>' +
      '<div class="names">' + pk.idx.map(i => esc(nameOf(i))).join(' / ') + '</div></div>' +
      '<div class="ev"><small>期待値</small><b class="' + evCls + '">' + evTxt + '</b><i>的中率 ' + pct(pk.p) + '</i></div></article>';
  }).join('');

  $('v-pick').innerHTML = raceChips() +
    '<div class="row between"><div class="row" style="gap:8px"><span class="tag">' + esc(DATA.race || 'レース') + '</span><span class="mute small">' + esc(DATA.course || '') + ' ・ ' + H.length + '頭立て</span></div>' +
    (DATA.sample ? '<span class="tag-line">SAMPLE</span>' : '<span class="tag-line">' + esc(DATA.date || '') + '</span>') + '</div>' +
    '<div><div class="small mute">今日の予想</div><h1 class="title disp">今日の買い目</h1></div>' +
    '<div><p class="sec">勝率ランキング</p>' + rank + '</div>' +
    '<div class="metrics">' +
    '<div class="metric"><div class="k">的中率</div><div class="v">' + pct(SUMMARY.anyHit, 1) + '</div></div>' +
    '<div class="metric"><div class="k">購入金額</div><div class="v">' + SUMMARY.cost.toLocaleString('ja-JP') + '円</div></div>' +
    '<div class="metric"><div class="k">期待回収率</div><div class="v ' + (SUMMARY.roi === null ? 'none' : (SUMMARY.roi >= 1 ? 'good' : 'weak')) + '">' + (SUMMARY.roi === null ? '—' : Math.round(SUMMARY.roi * 100) + '%') + '</div></div>' +
    '</div>' +
    '<div><div class="row between"><p class="sec">買い目</p><span class="small mute">期待値1超 ' + SUMMARY.goodCount + '/' + PICKS.length + '点</span></div>' + bets + '</div>' +
    (DATA.note ? '<p class="foot" style="text-align:left">' + esc(DATA.note) + '</p>' : '') +
    '<div class="push"><button class="btn" data-act="sim">シミュレーションを回す</button>' +
    '<p class="foot">確率は能力値から計算した値で、期待値は 的中率 × オッズ です。1を超えても的中や回収を約束するものではありません。</p></div>';
}

function newSim() {
  SIM = { runs: 0, anyHit: 0, back: 0, cost: 0, series: [0], per: PICKS.map(() => ({ hit: 0, back: 0 })), last: null };
}

function runOnce(order) {
  let back = 0, any = false;
  PICKS.forEach((pk, k) => {
    const hit = isHit(pk, order);
    const pay = hit && pk.odds !== null ? Math.round(pk.odds * CFG.UNIT) : 0;
    if (hit) { any = true; SIM.per[k].hit++; }
    SIM.per[k].back += pay;
    back += pay;
  });
  const cost = PICKS.length * CFG.UNIT;
  SIM.runs++;
  SIM.cost += cost;
  SIM.back += back;
  if (any) SIM.anyHit++;
  SIM.series.push(SIM.back - SIM.cost);
  return { net: back - cost, any };
}

function renderSim() {
  const H = DATA.horses, n = H.length;
  const laneH = Math.max(24, Math.min(32, Math.floor(280 / n)));
  const size = laneH - 6;
  const lanes = H.map((h, i) =>
    '<div class="lane"><div class="runner" id="run' + i + '" style="background:' + colorOf(i) + ';box-shadow:0 0 10px ' + colorOf(i) + '">' + h.no + '</div></div>'
  ).join('');
  $('v-sim').innerHTML =
    '<div class="row between"><button class="back" data-act="pick">‹ 予想に戻る</button><span class="mute small">' + esc(DATA.race || '') + ' ・ ' + esc(DATA.course || '') + '</span></div>' +
    '<div class="lanes" id="lanes" style="--lane:' + laneH + 'px;--size:' + size + 'px">' + lanes + '<div class="finish"></div></div>' +
    '<p class="say" id="say">「1回 回す」でスタート</p>' +
    '<div id="last"></div>' +
    '<div class="stats" id="stats"></div>' +
    '<div class="chart"><div class="row between"><p class="sec">収支の推移</p><span class="small mute" id="legend"></span></div><div id="chart"></div></div>' +
    '<div><p class="sec">買い目ごとの成績</p><div class="pertable" id="per"></div></div>' +
    '<p class="foot">回数が少ないうちは運でブレます。回すほど、期待回収率に近づいていきます。確率にもとづくシミュレーションで、実際のレース結果ではありません。</p>' +
    '<div class="dock" id="dock">' +
    '<button class="btn" data-act="run1">1回 回す</button>' +
    '<div class="runs"><button class="btn ghost" data-act="run10">×10</button><button class="btn ghost" data-act="run100">×100</button><button class="btn ghost" data-act="run1000">×1000</button></div>' +
    '<button class="reset" data-act="reset">記録をリセット</button></div>';
  updateSim();
}

function chartSvg() {
  const s = SIM.series, len = s.length;
  if (len < 2) return '<p class="foot" style="padding:36px 0">回すと、ここに収支のグラフが出ます。</p>';
  const W = 360, H = 150, pl = 8, pr = 8, pt = 12, pb = 12;
  const step = Math.max(1, Math.ceil((len - 1) / 300));
  const pts = [];
  for (let i = 0; i < len; i += step) pts.push([i, s[i]]);
  if (pts[pts.length - 1][0] !== len - 1) pts.push([len - 1, s[len - 1]]);
  const cost = PICKS.length * CFG.UNIT;
  const expEnd = SUMMARY.roi === null ? null : (SUMMARY.roi - 1) * cost * (len - 1);
  let lo = 0, hi = 0;
  pts.forEach(p => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); });
  if (expEnd !== null) { lo = Math.min(lo, expEnd); hi = Math.max(hi, expEnd); }
  const pad = (hi - lo) * 0.12 || 500;
  lo -= pad; hi += pad;
  const X = (i) => pl + (i / (len - 1)) * (W - pl - pr);
  const Y = (v) => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const d = 'M' + pts.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' L');
  const last = pts[pts.length - 1];
  const up = last[1] >= 0;
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="累計収支の推移グラフ">' +
    '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '" style="stroke:#4A4780;stroke-width:1;stroke-dasharray:4 4"/>' +
    (expEnd !== null ? '<line x1="' + X(0).toFixed(1) + '" y1="' + Y(0).toFixed(1) + '" x2="' + X(len - 1).toFixed(1) + '" y2="' + Y(expEnd).toFixed(1) + '" style="stroke:#FF3D81;stroke-width:1.5;stroke-dasharray:5 4"/>' : '') +
    '<path d="' + d + '" style="fill:none;stroke:' + (up ? '#C6FF3D' : '#3DE8FF') + ';stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"/>' +
    '<circle cx="' + X(last[0]).toFixed(1) + '" cy="' + Y(last[1]).toFixed(1) + '" r="4.5" style="fill:' + (up ? '#C6FF3D' : '#3DE8FF') + '"/></svg>';
}

function updateSim() {
  const S = SIM;
  const net = S.back - S.cost;
  const roi = S.cost ? S.back / S.cost : null;
  const oc = S.runs ? (net >= 0 ? 'good' : 'none') : 'none';
  $('stats').innerHTML =
    '<div class="stat"><div class="k">試行回数</div><div class="v">' + S.runs.toLocaleString('ja-JP') + '回</div><div class="s">購入 ' + yen(S.cost) + '</div></div>' +
    '<div class="stat"><div class="k">累計収支</div><div class="v ' + oc + '">' + (S.runs ? sgn(net) : '—') + '</div><div class="s">払戻 ' + yen(S.back) + '</div></div>' +
    '<div class="stat"><div class="k">回収率</div><div class="v ' + (roi === null ? 'none' : (roi >= 1 ? 'good' : 'weak')) + '">' + (roi === null ? '—' : Math.round(roi * 100) + '%') + '</div><div class="s">期待 ' + (SUMMARY.roi === null ? '—' : Math.round(SUMMARY.roi * 100) + '%') + '</div></div>' +
    '<div class="stat"><div class="k">的中率</div><div class="v">' + (S.runs ? pct(S.anyHit / S.runs, 1) : '—') + '</div><div class="s">計算値 ' + pct(SUMMARY.anyHit, 1) + '</div></div>';

  const L = S.last;
  let lastHtml = '<span class="mute">まだ回していません</span>';
  if (L && L.type === 'one') {
    const medal = ['var(--gold)', 'var(--lime)', 'var(--aqua)'];
    lastHtml = [0, 1, 2].map(r =>
      '<span class="c" style="color:' + medal[r] + '">' + (r + 1) + '着<i style="background:' + medal[r] + '">' + noOf(L.order[r]) + '</i></span>'
    ).join('') + '<span class="st ' + (L.net > 0 ? 'good' : 'none') + '">' + (L.any ? '' : 'ハズレ ') + sgn(L.net) + '</span>';
  } else if (L && L.type === 'batch') {
    lastHtml = '<span>直近 ' + L.k.toLocaleString('ja-JP') + '回</span><span class="mute">的中 ' + L.hits.toLocaleString('ja-JP') + '回</span><span class="st ' + (L.net > 0 ? 'good' : 'none') + '">' + sgn(L.net) + '</span>';
  }
  $('last').innerHTML = '<div class="last">' + lastHtml + '</div>';

  $('chart').innerHTML = chartSvg();
  $('legend').innerHTML = S.series.length > 1 ? '<span style="color:var(--lime)">━</span> 実際 <span style="color:var(--pink)">┅</span> 期待どおり' : '';

  $('per').innerHTML = PICKS.map((pk, k) => {
    const p = S.per[k];
    const r = S.runs ? p.back / (S.runs * CFG.UNIT) : null;
    return '<div class="per"><span class="k">' + pk.label + '</span><span class="n">' + pk.idx.map(noOf).join(' − ') + '</span>' +
      '<span class="h">的中 ' + p.hit.toLocaleString('ja-JP') + '/' + S.runs.toLocaleString('ja-JP') + '</span>' +
      '<span class="y ' + (r === null ? 'none' : (r >= 1 ? 'good' : 'weak')) + '">' + (r === null ? '—' : Math.round(r * 100) + '%') + '</span></div>';
  }).join('');
}

function setDock(disabled) {
  document.querySelectorAll('#dock button').forEach(b => { b.disabled = disabled; });
}

function toast(net) {
  const t = $('toast');
  t.textContent = sgn(net);
  t.className = 'on' + (net < 0 ? ' neg' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 1600);
}

function confetti() {
  const box = $('confetti');
  box.innerHTML = '';
  if (reduce) return;
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('span');
    s.style.left = (Math.random() * 100) + '%';
    s.style.width = (6 + Math.random() * 5) + 'px';
    s.style.height = (8 + Math.random() * 8) + 'px';
    s.style.background = COLORS[i % COLORS.length];
    s.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
    s.style.animationDelay = (-Math.random() * 2) + 's';
    box.appendChild(s);
  }
  setTimeout(() => { box.innerHTML = ''; }, 5000);
}

function animateRace(order, done) {
  cancelAnimationFrame(raf);
  const H = DATA.horses, n = H.length;
  const runners = H.map((_, i) => $('run' + i));
  runners.forEach(r => { r.style.transform = 'translateX(0px)'; });
  if (reduce) { done(); return; }
  const rank = new Array(n);
  order.forEach((idx, r) => { rank[idx] = r; });
  const F = H.map((_, i) => 3.2 + rank[i] * 0.12 + Math.random() * 0.05);
  const phase = H.map(() => Math.random() * 6.28);
  const amp = H.map(() => 0.05 + Math.random() * 0.05);
  const size = parseFloat(getComputedStyle($('lanes')).getPropertyValue('--size')) || 26;
  const travel = Math.max(10, $('lanes').clientWidth - 16 - 8 - size);
  const endAt = F[order[0]] + 0.7;
  const say = $('say');
  const t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    let leader = 0, lx = -1;
    for (let i = 0; i < n; i++) {
      const u = Math.min(1, t / F[i]);
      let x = u < 1 ? u + amp[i] * Math.sin(u * 9.4 + phase[i]) * (1 - u) : 1;
      x = Math.min(1, Math.max(0, x));
      runners[i].style.transform = 'translateX(' + (x * travel).toFixed(1) + 'px)';
      if (x > lx) { lx = x; leader = i; }
    }
    if (t >= F[order[0]]) say.textContent = 'ゴール！ 1着は ' + noOf(order[0]) + '番';
    else if (lx > 0.8) say.textContent = '最後の直線、' + noOf(leader) + '番が先頭';
    else if (t > 0.6) say.textContent = '先頭は ' + noOf(leader) + '番';
    else say.textContent = 'スタート！';
    if (t >= endAt) { done(); return; }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
}

function run1() {
  if (busy) return;
  const order = sampleOrder(MODEL.w);
  busy = true;
  setDock(true);
  animateRace(order, () => {
    const r = runOnce(order);
    SIM.last = { type: 'one', order: order, net: r.net, any: r.any };
    busy = false;
    setDock(false);
    updateSim();
    toast(r.net);
    if (r.net > 0) confetti();
  });
}

function runN(k) {
  if (busy) return;
  const before = SIM.back - SIM.cost, hit0 = SIM.anyHit;
  for (let i = 0; i < k; i++) runOnce(sampleOrder(MODEL.w));
  const net = (SIM.back - SIM.cost) - before;
  SIM.last = { type: 'batch', k: k, net: net, hits: SIM.anyHit - hit0 };
  $('say').textContent = k.toLocaleString('ja-JP') + '回、一気に回しました';
  updateSim();
  toast(net);
  if (net > 0 && k >= 100) confetti();
}

function showSim() {
  if (!SIM) newSim();
  busy = false;
  renderSim();
  show('v-sim');
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.getAttribute('data-act');
  if (act === 'pickrace') {
    const i = parseInt(b.getAttribute('data-i'), 10);
    loadRace(i);
    try { history.replaceState(null, '', '#r' + (i + 1)); } catch (err) {}
    return;
  }
  if (!DATA) return;
  if (act === 'sim') showSim();
  else if (act === 'pick') { cancelAnimationFrame(raf); busy = false; show('v-pick'); }
  else if (act === 'run1') run1();
  else if (act === 'run10') runN(10);
  else if (act === 'run100') runN(100);
  else if (act === 'run1000') runN(1000);
  else if (act === 'reset') { if (!busy) { newSim(); renderSim(); } }
});

function loadRace(i) {
  cancelAnimationFrame(raf);
  busy = false;
  CUR = i;
  const r = RACES[i];
  const d = Object.assign({}, r, {
    date: r.date || ROOT.date,
    sample: r.sample !== undefined ? r.sample : ROOT.sample
  });
  const bad = validateData(d);
  if (bad) {
    DATA = null;
    $('v-pick').innerHTML = raceChips() + '<div class="err">' + esc(r.race || (i + 1) + 'R') + ' の内容を確認してください。<br>' + esc(bad) + '</div>';
    show('v-pick');
    return;
  }
  DATA = d;
  MODEL = computeModel(DATA.horses);
  MAPS = buildOddsMaps(DATA);
  PICKS = choosePicks(DATA, MODEL, MAPS);
  SUMMARY = summarize(PICKS, MODEL);
  newSim();
  renderPick();
  show('v-pick');
}

async function boot() {
  try {
    const res = await fetch('race.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    ROOT = await res.json();
  } catch (e) {
    $('v-pick').innerHTML = '<div class="err">race.json を読み込めませんでした。<br>・ファイル名が race.json になっているか<br>・index.html と同じ場所に置いてあるか<br>・GitHub Pages のURLから開いているか（ダブルクリックで開くと読めません）</div>';
    return;
  }
  RACES = (ROOT && Array.isArray(ROOT.races) && ROOT.races.length) ? ROOT.races : [ROOT];
  const m = /r(\d+)/.exec(location.hash);
  let i = m ? parseInt(m[1], 10) - 1 : 0;
  if (!(i >= 0 && i < RACES.length)) i = 0;
  loadRace(i);
}
boot();
</script>
</body>
</html>
