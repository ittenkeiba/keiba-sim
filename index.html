<body>
<main>
<section id="v-pick" class="view"><p class="foot">読み込み中…</p></section>
<section id="v-sim" class="view" hidden></section>
</main>
<div id="toast" aria-live="polite"></div>
<div id="confetti" aria-hidden="true"></div>

<script>
/*LOGIC_START*/
const CFG = {
  UNIT: 100,
  MIN_P: { tan: 0.05, fuku: 0.20, umaren: 0.03, wide: 0.10 },
  WIDE_SECOND_MIN_EV: 1.0
};

function pairKey(a, b) { return a < b ? a + '-' + b : b + '-' + a; }

function forEachTriple(w, S, cb) {
  const n = w.length;
  for (let a = 0; a < n; a++) {
    const pa = w[a] / S;
    for (let b = 0; b < n; b++) {
      if (b === a) continue;
      const pb = w[b] / (S - w[a]);
      for (let c = 0; c < n; c++) {
        if (c === a || c === b) continue;
        const pc = w[c] / (S - w[a] - w[b]);
        cb(a, b, c, pa * pb * pc);
      }
    }
  }
}

function computeModel(horses) {
  const n = horses.length;
  const w = horses.map(h => Number(h.power));
  const S = w.reduce((x, y) => x + y, 0);
  const win = new Array(n).fill(0);
  const top3 = new Array(n).fill(0);
  const p2 = new Array(n).fill(0);
  const p3 = new Array(n).fill(0);
  let pMax = 0;
  const quinella = {};
  const wide = {};
  const add = (o, k, p) => { o[k] = (o[k] || 0) + p; };
  forEachTriple(w, S, (a, b, c, p) => {
    win[a] += p;
    p2[b] += p; p3[c] += p;
    if (p > pMax) pMax = p;
    top3[a] += p; top3[b] += p; top3[c] += p;
    add(quinella, pairKey(a, b), p);
    add(wide, pairKey(a, b), p);
    add(wide, pairKey(a, c), p);
    add(wide, pairKey(b, c), p);
  });
  return { n, w, S, win, p2, p3, pMax, top3, quinella, wide };
}

function buildOddsMaps(data) {
  const noToIdx = {};
  data.horses.forEach((h, i) => { noToIdx[h.no] = i; });
  const toMap = (list) => {
    const m = {};
    (list || []).forEach(x => {
      const a = noToIdx[x.pair[0]], b = noToIdx[x.pair[1]];
      if (a === undefined || b === undefined) return;
      m[pairKey(a, b)] = Number(x.odds);
    });
    return m;
  };
  return { umaren: toMap(data.umaren), wide: toMap(data.wide) };
}

function makeCand(idx, p, odds) {
  const o = (odds === undefined || odds === null || isNaN(odds)) ? null : Number(odds);
  return { idx, p, odds: o, ev: o === null ? null : p * o };
}

function rankCands(cands, minP) {
  let pool = cands.filter(c => c.p >= minP);
  if (!pool.length) pool = cands.slice();
  const withOdds = pool.filter(c => c.odds !== null);
  if (withOdds.length) pool = withOdds;
  return pool.slice().sort((x, y) => (y.ev !== null ? y.ev : y.p) - (x.ev !== null ? x.ev : x.p));
}

function choosePicks(data, model, maps) {
  const H = data.horses;
  const picks = [];
  const tan = rankCands(H.map((h, i) => makeCand([i], model.win[i], h.tan)), CFG.MIN_P.tan)[0];
  if (tan) picks.push(Object.assign({ type: 'tan', label: '単勝', unit: '1点' }, tan));
  const fuku = rankCands(H.map((h, i) => makeCand([i], model.top3[i], h.fuku)), CFG.MIN_P.fuku)[0];
  if (fuku) picks.push(Object.assign({ type: 'fuku', label: '複勝', unit: '1点' }, fuku));
  const um = Object.keys(model.quinella).map(k => {
    const [a, b] = k.split('-').map(Number);
    return makeCand([a, b], model.quinella[k], maps.umaren[k]);
  });
  const umBest = rankCands(um, CFG.MIN_P.umaren)[0];
  if (umBest) picks.push(Object.assign({ type: 'umaren', label: '馬連', unit: '1点' }, umBest));
  const wd = Object.keys(model.wide).map(k => {
    const [a, b] = k.split('-').map(Number);
    return makeCand([a, b], model.wide[k], maps.wide[k]);
  });
  const wdRank = rankCands(wd, CFG.MIN_P.wide);
  if (wdRank[0]) picks.push(Object.assign({ type: 'wide', label: 'ワイド', unit: '1点目' }, wdRank[0]));
  if (wdRank[1] && wdRank[1].ev !== null && wdRank[1].ev >= CFG.WIDE_SECOND_MIN_EV) {
    picks.push(Object.assign({ type: 'wide', label: 'ワイド', unit: '2点目' }, wdRank[1]));
  }
  return picks;
}

function isHit(pick, order) {
  const f = order[0], s = order[1];
  const top3 = order.slice(0, 3);
  if (pick.type === 'tan') return f === pick.idx[0];
  if (pick.type === 'fuku') return top3.indexOf(pick.idx[0]) >= 0;
  if (pick.type === 'umaren') return (f === pick.idx[0] && s === pick.idx[1]) || (f === pick.idx[1] && s === pick.idx[0]);
  if (pick.type === 'wide') return top3.indexOf(pick.idx[0]) >= 0 && top3.indexOf(pick.idx[1]) >= 0;
  return false;
}

function summarize(picks, model) {
  let anyHit = 0, expBack = 0;
  forEachTriple(model.w, model.S, (a, b, c, p) => {
    const order = [a, b, c];
    let hit = false, back = 0;
    picks.forEach(pk => {
      if (isHit(pk, order)) { hit = true; back += pk.odds !== null ? pk.odds * CFG.UNIT : 0; }
    });
    if (hit) anyHit += p;
    expBack += p * back;
  });
  const cost = picks.length * CFG.UNIT;
  const allOdds = picks.every(pk => pk.odds !== null);
  return { anyHit, cost, roi: allOdds && cost ? expBack / cost : null, goodCount: picks.filter(pk => pk.ev !== null && pk.ev >= 1).length };
}

function sampleOrder(w, rnd) {
  const r = rnd || Math.random;
  const pool = w.map((_, i) => i);
  const order = [];
  while (pool.length) {
    let sum = 0;
    pool.forEach(i => { sum += w[i]; });
    let x = r() * sum, pick = pool.length - 1;
    for (let k = 0; k < pool.length; k++) {
      x -= w[pool[k]];
      if (x <= 0) { pick = k; break; }
    }
    order.push(pool.splice(pick, 1)[0]);
  }
  return order;
}

function orderProb(model, order) {
  const w = model.w, S = model.S;
  const a = order[0], b = order[1], c = order[2];
  return (w[a] / S) * (w[b] / (S - w[a])) * (w[c] / (S - w[a] - w[b]));
}

function rarityOf(model, p) {
  const ratio = model.pMax / p;
  if (ratio >= 60) return { key: 'ultra', name: '超激レア', color: '#FFC83D' };
  if (ratio >= 12) return { key: 'sr', name: '激レア', color: '#FF3D81' };
  if (ratio >= 3) return { key: 'r', name: 'レア', color: '#3DE8FF' };
  return { key: 'c', name: '王道', color: '#A9A6D6' };
}

function validateData(data) {
  if (!data || !Array.isArray(data.horses) || data.horses.length < 3) return 'horses が3頭以上ありません。';
  for (const h of data.horses) {
    if (typeof h.no !== 'number' || !h.name || !(Number(h.power) > 0)) return '馬の no / name / power（0より大きい数）を確認してください。';
  }
  return '';
}
/*LOGIC_END*/

const COLORS = ['#C6FF3D', '#FF3D81', '#FFC83D', '#3DE8FF', '#A78BFF', '#FF8A3D', '#EEEBFF', '#3DFFB0'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = (n) => Math.round(n).toLocaleString('ja-JP') + '円';
const sgn = (n) => (n >= 0 ? '+' : '−') + Math.abs(Math.round(n)).toLocaleString('ja-JP') + '円';
const pct = (x, d) => (x * 100).toFixed(d === undefined ? 1 : d) + '%';
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function chips(idx, cls) {

    '<div class="metric"><div class="k">期待回収率</div><div class="v ' + (SUMMARY.roi === null ? 'none' : (SUMMARY.roi >= 1 ? 'good' : 'weak')) + '">' + (SUMMARY.roi === null ? '—' : Math.round(SUMMARY.roi * 100) + '%') + '</div></div>' +
    '</div>' +
    '<div><div class="row between"><p class="sec">買い目</p><span class="small mute">期待値1超 ' + SUMMARY.goodCount + '/' + PICKS.length + '点</span></div>' + bets + '</div>' +
    (DATA.note ? '<p class="foot" style="text-align:left">' + esc(DATA.note) + '</p>' : '') +

    '<p class="foot">確率は能力値から計算した値で、期待値は 的中率 × オッズ です。1を超えても的中や回収を約束するものではありません。</p></div>';
}

function newSim() {
  SIM = { runs: 0, anyHit: 0, back: 0, cost: 0, series: [0], per: PICKS.map(() => ({ hit: 0, back: 0 })), hs: DATA.horses.map(() => ({ sum: 0, c1: 0, c2: 0, c3: 0 })), streak: 0, best: 0, showAll: false, last: null };
  PREV = {};
}

function runOnce(order) {
  let back = 0, any = false;
  PICKS.forEach((pk, k) => {
    const hit = isHit(pk, order);
    const pay = hit && pk.odds !== null ? Math.round(pk.odds * CFG.UNIT) : 0;
    if (hit) { any = true; SIM.per[k].hit++; }
    SIM.per[k].back += pay;
    back += pay;
  });
  const cost = PICKS.length * CFG.UNIT;
  SIM.runs++;
  SIM.cost += cost;
  SIM.back += back;
  if (any) SIM.anyHit++;
  SIM.series.push(SIM.back - SIM.cost);
  order.forEach((idx, r) => {
    const h = SIM.hs[idx];
    h.sum += r + 1;
    if (r === 0) h.c1++; else if (r === 1) h.c2++; else if (r === 2) h.c3++;
  });
  if (back - cost > 0) { SIM.streak++; if (SIM.streak > SIM.best) SIM.best = SIM.streak; } else { SIM.streak = 0; }
  return { net: back - cost, any };
}

const TR = { cx: 180, cy: 125, R: 62, L: 150, W: 66 };
const COATS = ['#6B4226', '#3B2A20', '#8A5A33', '#2E2A2A', '#A0703F', '#57392B'];
let TRG = { sp: 6, scale: 1 };
let HG = [], HI = [], HL = [], CT1 = null, CT2 = null;

function trackPos(p, d) {
  const r = TR.R + d, L = TR.L, cx = TR.cx, cy = TR.cy;
  const total = 2 * L + 2 * Math.PI * r;
  let s = (((p % 1) + 1) % 1) * total;
  const half = L / 2, arc = Math.PI * r;
  if (s < half) return { x: cx + s, y: cy + r, a: 0 };
  s -= half;
  if (s < arc) {
    const phi = Math.PI / 2 - s / r;
    return { x: cx + half + r * Math.cos(phi), y: cy + r * Math.sin(phi), a: (phi - Math.PI / 2) * 180 / Math.PI };
  }
  s -= arc;
  if (s < L) return { x: cx + half - s, y: cy - r, a: 180 };
  s -= L;
  if (s < arc) {
    const phi = -Math.PI / 2 - s / r;
    return { x: cx - half + r * Math.cos(phi), y: cy + r * Math.sin(phi), a: (phi - Math.PI / 2) * 180 / Math.PI };
  }
  s -= arc;
  return { x: cx - half + s, y: cy + r, a: 0 };
}

function trackSvg() {
  const H = DATA.horses, n = H.length;
  const cx = TR.cx, cy = TR.cy, R = TR.R, L = TR.L, W = TR.W, half = L / 2;
  const sp = n > 1 ? Math.min(10, (W - 10) / (n - 1)) : 0;
  TRG = { sp: sp, scale: Math.max(0.42, Math.min(1.3, sp / 7)) };
  const path = (r) => 'M' + (cx - half) + ',' + (cy + r) + ' L' + (cx + half) + ',' + (cy + r) +
    ' A' + r + ',' + r + ' 0 0 0 ' + (cx + half) + ',' + (cy - r) +
    ' L' + (cx - half) + ',' + (cy - r) +
    ' A' + r + ',' + r + ' 0 0 0 ' + (cx - half) + ',' + (cy + r) + ' Z';
  const dirt = /ダ/.test(DATA.course || '');
  const band = dirt ? '#6B4A31' : '#2A6B43';
  const infield = dirt ? '#1B2A22' : '#0F2A1D';
  const fs = n > 10 ? 6.5 : 8;
  const horses = H.map((h, i) => {
    const coat = COATS[i % COATS.length];
    return '<g id="hg' + i + '"><g id="hi' + i + '">' +
      '<ellipse cx="0" cy="1.2" rx="7.5" ry="3.6" style="fill:#000;opacity:.25"/>' +
      '<path d="M-7,0 C-10,-1.5 -12,1.5 -11.5,4" style="fill:none;stroke:' + coat + ';stroke-width:1.3;stroke-linecap:round"/>' +
      '<ellipse cx="0" cy="0" rx="7" ry="3.3" style="fill:' + coat + '"/>' +
      '<ellipse cx="7.8" cy="0" rx="3.6" ry="1.8" style="fill:' + coat + '"/>' +
      '<circle cx="0.6" cy="0" r="2.5" style="fill:' + colorOf(i) + ';stroke:#0B0A1A;stroke-width:.6"/>' +
      '</g><text id="hl' + i + '" x="0" y="-8" text-anchor="middle" style="font-size:' + fs + 'px;font-weight:900;fill:#fff;stroke:#0B0A1A;stroke-width:2;paint-order:stroke;opacity:0">' + h.no + '</text></g>';
  }).join('');
  return '<svg viewBox="0 0 360 250" role="img" aria-label="コースを1周するレースの映像">' +
    '<path d="' + path(R - W / 2) + '" style="fill:' + infield + '"/>' +
    '<path d="' + path(R) + '" style="fill:none;stroke:' + band + ';stroke-width:' + W + '"/>' +
    '<path d="' + path(R - W / 2) + '" style="fill:none;stroke:#EEEBFF;stroke-opacity:.6;stroke-width:1.2"/>' +
    '<path d="' + path(R + W / 2) + '" style="fill:none;stroke:#EEEBFF;stroke-opacity:.6;stroke-width:1.2"/>' +
    '<line x1="' + cx + '" x2="' + cx + '" y1="' + (cy + R - W / 2) + '" y2="' + (cy + R + W / 2) + '" style="stroke:#fff;stroke-width:2;stroke-dasharray:3 3"/>' +
    '<text x="' + cx + '" y="' + (cy + R + W / 2 + 11) + '" text-anchor="middle" style="font-size:8px;fill:#A9A6D6;letter-spacing:.2em">START / GOAL</text>' +
    '<text id="ct1" x="' + cx + '" y="' + (cy + 8) + '" text-anchor="middle" style="font-family:\'Dela Gothic One\',sans-serif;font-size:26px;fill:#C6FF3D">READY</text>' +
    '<text id="ct2" x="' + cx + '" y="' + (cy + 26) + '" text-anchor="middle" style="font-size:9px;fill:#A9A6D6">スタート待ち</text>' +
    horses + '</svg>';
}

function ctrSet(big, cap, color, size) {
  if (!CT1) return;
  CT1.textContent = big;
  CT1.style.fill = color || '#C6FF3D';
  CT1.style.fontSize = (size || 26) + 'px';
  CT2.textContent = cap || '';
}

function placeHorse(i, p, t) {
  const n = DATA.horses.length;
  const d = (i - (n - 1) / 2) * TRG.sp;
  const q = trackPos(p, d);
  HG[i].setAttribute('transform', 'translate(' + q.x.toFixed(1) + ' ' + q.y.toFixed(1) + ')');
  const sx = TRG.scale * (1 + 0.06 * Math.sin(t * 24 + i));
  HI[i].setAttribute('transform', 'rotate(' + q.a.toFixed(1) + ') scale(' + sx.toFixed(3) + ' ' + TRG.scale.toFixed(3) + ')');
}

function setLabels(set) {
  for (let i = 0; i < HL.length; i++) HL[i].style.opacity = set.has(i) ? 1 : 0;
}

function resetTrack() {
  const n = DATA.horses.length;
  for (let i = 0; i < n; i++) placeHorse(i, 0, 0);
  setLabels(new Set());
  ctrSet('READY', 'スタート待ち', '#C6FF3D', 22);
}

function chartSvg() {
  const s = SIM.series, len = s.length;
  if (len < 2) return '<p class="foot" style="padding:36px 0">回すと、ここに収支のグラフが出ます。</p>';
  const W = 360, H = 150, pl = 8, pr = 8, pt = 12, pb = 12;
  const step = Math.max(1, Math.ceil((len - 1) / 300));
  const pts = [];
  for (let i = 0; i < len; i += step) pts.push([i, s[i]]);
  if (pts[pts.length - 1][0] !== len - 1) pts.push([len - 1, s[len - 1]]);
  const cost = PICKS.length * CFG.UNIT;
  const expEnd = SUMMARY.roi === null ? null : (SUMMARY.roi - 1) * cost * (len - 1);
  let lo = 0, hi = 0;
  pts.forEach(p => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); });
  if (expEnd !== null) { lo = Math.min(lo, expEnd); hi = Math.max(hi, expEnd); }
  const pad = (hi - lo) * 0.12 || 500;
  lo -= pad; hi += pad;
  const X = (i) => pl + (i / (len - 1)) * (W - pl - pr);
  const Y = (v) => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const d = 'M' + pts.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' L');
  const last = pts[pts.length - 1];
  const up = last[1] >= 0;
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="累計収支の推移グラフ">' +
    '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '" style="stroke:#4A4780;stroke-width:1;stroke-dasharray:4 4"/>' +
    (expEnd !== null ? '<line x1="' + X(0).toFixed(1) + '" y1="' + Y(0).toFixed(1) + '" x2="' + X(len - 1).toFixed(1) + '" y2="' + Y(expEnd).toFixed(1) + '" style="stroke:#FF3D81;stroke-width:1.5;stroke-dasharray:5 4"/>' : '') +
    '<path d="' + d + '" style="fill:none;stroke:' + (up ? '#C6FF3D' : '#3DE8FF') + ';stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"/>' +
    '<circle cx="' + X(last[0]).toFixed(1) + '" cy="' + Y(last[1]).toFixed(1) + '" r="4.5" style="fill:' + (up ? '#C6FF3D' : '#3DE8FF') + '"/></svg>';
}

function histRows() {
  const H = DATA.horses, S = SIM;
  return H.map((h, i) => ({ i: i, avg: S.hs[i].sum / S.runs })).sort((a, b) => a.avg - b.avg);
}

function boardHtml() {
  const L = SIM.last;
  if (!L) return '<div class="board"><p class="foot" style="padding:14px 0">「回す」を押すと、ここに着順と確率が出ます。</p></div>';
  const streak = SIM.streak >= 2 ? '<span class="badge">' + SIM.streak + '連続プラス</span>' : '';
  const best = SIM.best >= 2 ? '<span class="mute small">最高 ' + SIM.best + '連続</span>' : '';
  if (L.type === 'batch') {
    const top = histRows()[0];
    return '<div class="board"><div class="bh"><span class="sec">直近 ' + L.k.toLocaleString('ja-JP') + '回のまとめ</span></div>' +
      '<div class="bfoot" style="border-top:0;margin-top:4px;padding-top:0"><span class="st ' + (L.net > 0 ? 'good' : 'none') + '">' + sgn(L.net) + '</span>' +
      '<span class="mute">的中 ' + L.hits.toLocaleString('ja-JP') + '回</span>' + streak + best + '</div>' +
      '<div class="bcap" style="margin:8px 0 0">平均着順トップ： ' + noOf(top.i) + '番 ' + esc(nameOf(top.i)) + '（' + top.avg.toFixed(2) + '着）</div></div>';
  }
  const medal = ['var(--gold)', 'var(--lime)', 'var(--aqua)'];
  const probs = [MODEL.win, MODEL.p2, MODEL.p3];
  const rows = [0, 1, 2].map(r => {
    const i = L.order[r];
    return '<div class="br r' + (r + 1) + '"><span class="rk" style="color:' + medal[r] + '">' + (r + 1) + '着</span>' +
      '<span class="chip sm" style="border-color:' + colorOf(i) + ';color:' + colorOf(i) + '">' + noOf(i) + '</span>' +
      '<span class="bn">' + esc(nameOf(i)) + '</span>' +
      '<span class="bp" style="color:' + (r === 0 ? 'var(--gold)' : 'var(--text)') + '">' + pct(probs[r][i]) + '</span></div>';
  }).join('');
  const rest = L.order.slice(3);
  const restHtml = rest.length ? '<div class="brest"><span>4着以下</span>' + rest.map(i => '<span class="mini" style="background:' + colorOf(i) + '">' + noOf(i) + '</span>').join('') + '</div>' : '';
  const once = Math.round(1 / L.p);
  return '<div class="board"><div class="bh"><span class="sec">今回の着順</span>' +
    '<span class="rar ' + L.rar.key + '" style="color:' + L.rar.color + ';border-color:' + L.rar.color + '">' + L.rar.name + '</span></div>' +
    '<div class="bcap">右の数字は、その馬がその着順になる確率。この並びは ' + pct(L.p, L.p < 0.01 ? 2 : 1) + '（約' + once.toLocaleString('ja-JP') + '回に1回）</div>' +
    rows + restHtml +
    '<div class="bfoot"><span class="st ' + (L.net > 0 ? 'good' : 'none') + '">' + sgn(L.net) + '</span><span class="badge ' + (L.any ? '' : 'miss') + '">' + (L.any ? '的中あり' : 'ハズレ') + '</span>' + streak + best + '</div></div>';
}

function histHtml() {
  const S = SIM;
  if (!S.runs) return '<div class="hist"><p class="foot" style="padding:14px 0">回すと、馬ごとの平均着順がここにたまります。</p></div>';
  const rows = histRows();
  const list = S.showAll ? rows : rows.slice(0, 5);
  const html = list.map((r, k) => {
    const h = S.hs[r.i];
    const f1 = h.c1 / S.runs, f2 = h.c2 / S.runs, f3 = h.c3 / S.runs;
    const top3 = f1 + f2 + f3;
    const cmp = S.runs >= 20 ? '（計算 ' + pct(MODEL.win[r.i]) + '）' : '';
    return '<div class="hr"><span class="ri">' + (k + 1) + '</span>' +
      '<span class="chip sm" style="border-color:' + colorOf(r.i) + ';color:' + colorOf(r.i) + '">' + noOf(r.i) + '</span>' +
      '<div class="hm"><div class="hn">' + esc(nameOf(r.i)) + '</div>' +
      '<div class="stack"><i style="width:' + (f1 * 100).toFixed(1) + '%;background:var(--gold)"></i><i style="width:' + (f2 * 100).toFixed(1) + '%;background:var(--lime)"></i><i style="width:' + (f3 * 100).toFixed(1) + '%;background:var(--aqua)"></i></div></div>' +
      '<div class="ha"><b>' + r.avg.toFixed(2) + '</b><small>平均着順</small></div></div>' +
      '<div class="hd">1着 ' + pct(f1) + cmp + ' ・ 3着内 ' + pct(top3, 0) + '</div>';
  }).join('');
  const more = rows.length > 5 ? '<button class="more" data-act="toggleall">' + (S.showAll ? '上位5頭だけ表示' : '全頭を見る（' + rows.length + '頭）') + '</button>' : '';
  return '<div class="hist"><div class="key"><span><i style="background:var(--gold)"></i>1着</span><span><i style="background:var(--lime)"></i>2着</span><span><i style="background:var(--aqua)"></i>3着</span></div>' + html + more + '</div>';
}

function updateSim(montage) {
  const S = SIM;
  const net = S.back - S.cost;
  const roi = S.cost ? S.back / S.cost : null;
  const oc = S.runs ? (net >= 0 ? 'good' : 'none') : 'none';
  $('stats').innerHTML =
    '<div class="stat"><div class="k">試行回数</div><div class="v">' + S.runs.toLocaleString('ja-JP') + '回</div><div class="s">購入 ' + yen(S.cost) + '</div></div>' +
    '<div class="stat"><div class="k">累計収支</div><div class="v ' + oc + '">' + (S.runs ? sgn(net) : '—') + '</div><div class="s">払戻 ' + yen(S.back) + '</div></div>' +
    '<div class="stat"><div class="k">回収率</div><div class="v ' + (roi === null ? 'none' : (roi >= 1 ? 'good' : 'weak')) + '">' + (roi === null ? '—' : Math.round(roi * 100) + '%') + '</div><div class="s">期待 ' + (SUMMARY.roi === null ? '—' : Math.round(SUMMARY.roi * 100) + '%') + '</div></div>' +
    '<div class="stat"><div class="k">的中率</div><div class="v">' + (S.runs ? pct(S.anyHit / S.runs, 1) : '—') + '</div><div class="s">計算値 ' + pct(SUMMARY.anyHit, 1) + '</div></div>';
  if (!montage) {
    $('board').innerHTML = boardHtml();
    document.querySelectorAll('#stats .stat .v').forEach((el, idx) => {
      const key = 's' + idx;
      if (PREV[key] !== undefined && PREV[key] !== el.textContent) el.classList.add('bump');
      PREV[key] = el.textContent;
    });
  }
  $('hstat').innerHTML = histHtml();
  $('hnote').textContent = S.runs && S.runs < 30 ? '回数が少ないうちは参考程度' : '';
  $('chart').innerHTML = chartSvg();
  $('legend').innerHTML = S.series.length > 1 ? '<span style="color:var(--lime)">━</span> 実際 <span style="color:var(--pink)">┅</span> 期待どおり' : '';
  $('per').innerHTML = PICKS.map((pk, k) => {
    const p = S.per[k];
    const r = S.runs ? p.back / (S.runs * CFG.UNIT) : null;
    return '<div class="per"><span class="k">' + pk.label + '</span><span class="n">' + pk.idx.map(noOf).join(' − ') + '</span>' +
      '<span class="h">的中 ' + p.hit.toLocaleString('ja-JP') + '/' + S.runs.toLocaleString('ja-JP') + '</span>' +
      '<span class="y ' + (r === null ? 'none' : (r >= 1 ? 'good' : 'weak')) + '">' + (r === null ? '—' : Math.round(r * 100) + '%') + '</span></div>';
  }).join('');
}

function setDock(disabled) {
  document.querySelectorAll('#dock button').forEach(b => { b.disabled = disabled; });
}

function toast(net) {
  const t = $('toast');
  t.textContent = sgn(net);
  t.className = 'on' + (net < 0 ? ' neg' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 1600);
}

function confetti() {
  const box = $('confetti');
  box.innerHTML = '';
  if (reduce) return;
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('span');
    s.style.left = (Math.random() * 100) + '%';
    s.style.width = (6 + Math.random() * 5) + 'px';
    s.style.height = (8 + Math.random() * 8) + 'px';
    s.style.background = COLORS[i % COLORS.length];
    s.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
    s.style.animationDelay = (-Math.random() * 2) + 's';
    box.appendChild(s);
  }
  setTimeout(() => { box.innerHTML = ''; }, 5000);
}

function animateRace(order, done) {
  cancelAnimationFrame(raf);
  const H = DATA.horses, n = H.length;
  resetTrack();
  if (reduce) { done(); return; }
  const rank = new Array(n);
  order.forEach((idx, r) => { rank[idx] = r; });
  const F = H.map((_, i) => 2.3 + rank[i] * 0.07 + Math.random() * 0.03);
  const phase = H.map(() => Math.random() * 6.28);
  const amp = H.map(() => 0.05 + Math.random() * 0.05);
  const endAt = F[order[0]] + 0.55;
  const say = $('say');
  const t0 = performance.now();
  const P = new Array(n).fill(0);
  function frame(now) {
    const t = (now - t0) / 1000;
    for (let i = 0; i < n; i++) {
      const u = Math.min(1, t / F[i]);
      let p;
      if (u < 1) p = Math.max(0, u + amp[i] * Math.sin(u * 9.4 + phase[i]) * (1 - u));
      else p = 1 + Math.min(0.05, (t - F[i]) * 0.05);
      P[i] = p;
      placeHorse(i, p, t);
    }
    const idx = P.map((_, i) => i).sort((a, b) => P[b] - P[a]);
    setLabels(new Set(idx.slice(0, 3)));
    if (t >= F[order[0]]) {
      say.textContent = 'ゴール！ 1着は ' + noOf(order[0]) + '番';
      ctrSet(String(noOf(order[0])), '1着', colorOf(order[0]), 34);
    } else {
      const lead = idx[0];
      say.textContent = P[lead] > 0.85 ? '最後の直線、' + noOf(lead) + '番が先頭' : (t > 0.4 ? '先頭は ' + noOf(lead) + '番' : 'スタート！');
      ctrSet(String(noOf(lead)), 'LEADER', colorOf(lead), 34);
    }
    if (t >= endAt) { done(); return; }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
}

function packShot(order, t) {
  const n = order.length;
  order.forEach((idx, r) => {
    const p = 0.74 + 0.24 * (1 - (n > 1 ? r / (n - 1) : 0)) + (Math.random() - 0.5) * 0.01;
    placeHorse(idx, p, t);
  });
  setLabels(new Set(order.slice(0, 3)));
}

function montage(k, dur, done) {
  cancelAnimationFrame(raf);
  resetTrack();
  if (reduce) {
    for (let i = 0; i < k; i++) runOnce(sampleOrder(MODEL.w));
    done();
    return;
  }
  const t0 = performance.now();
  let ran = 0, lastVis = 0, lastOrder = null;
  function frame(now) {
    const f = Math.min(1, (now - t0) / (dur * 1000));
    const target = Math.round(k * f);
    while (ran < target) { lastOrder = sampleOrder(MODEL.w); runOnce(lastOrder); ran++; }
    if (now - lastVis > 70 || f >= 1) {
      lastVis = now;
      if (lastOrder) packShot(lastOrder, now / 1000);
      ctrSet(ran.toLocaleString('ja-JP'), '/ ' + k.toLocaleString('ja-JP') + '回', '#FFC83D', ran >= 1000 ? 24 : 30);
      updateSim(true);
    }
    if (f >= 1) { done(); return; }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
}

function run1() {
  if (busy) return;
  const order = sampleOrder(MODEL.w);
  busy = true;
  setDock(true);
  animateRace(order, () => {
    const r = runOnce(order);
    const pTri = orderProb(MODEL, order);
    SIM.last = { type: 'one', order: order, net: r.net, any: r.any, p: pTri, rar: rarityOf(MODEL, pTri) };
    busy = false;
    setDock(false);
    updateSim();
    toast(r.net);
    if (r.net > 0 || SIM.last.rar.key === 'ultra') confetti();
  });
}

function runN(k) {
  if (busy) return;
  busy = true;
  setDock(true);
  const before = SIM.back - SIM.cost, hit0 = SIM.anyHit;
  const dur = k <= 10 ? 1.1 : (k <= 100 ? 1.8 : 2.4);
  $('say').textContent = k.toLocaleString('ja-JP') + '回、高速で回しています';
  montage(k, dur, () => {
    const net = (SIM.back - SIM.cost) - before;
    SIM.last = { type: 'batch', k: k, net: net, hits: SIM.anyHit - hit0 };
    $('say').textContent = k.toLocaleString('ja-JP') + '回 完了';
    ctrSet(sgn(net), '直近' + k.toLocaleString('ja-JP') + '回の収支', net > 0 ? '#C6FF3D' : '#A9A6D6', 20);
    busy = false;
    setDock(false);
    updateSim();
    toast(net);
    if (net > 0 && k >= 100) confetti();
  });
}

function showSim() {
  if (!SIM) newSim();
  busy = false;
  renderSim();
  show('v-sim');
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.getAttribute('data-act');
  if (act === 'pickrace') {
    const i = parseInt(b.getAttribute('data-i'), 10);
    loadRace(i);
    try { history.replaceState(null, '', '#r' + (i + 1)); } catch (err) {}
    return;
  }
  if (!DATA) return;
  if (act === 'sim') showSim();
  else if (act === 'pick') { cancelAnimationFrame(raf); busy = false; show('v-pick'); }
  else if (act === 'run1') run1();
  else if (act === 'run10') runN(10);
  else if (act === 'run100') runN(100);
  else if (act === 'run1000') runN(1000);
  else if (act === 'toggleall') { SIM.showAll = !SIM.showAll; updateSim(true); }
  else if (act === 'reset') { if (!busy) { newSim(); renderSim(); } }
});

function loadRace(i) {
  cancelAnimationFrame(raf);
  busy = false;
  CUR = i;
  const r = RACES[i];
  const d = Object.assign({}, r, {
    date: r.date || ROOT.date,
    sample: r.sample !== undefined ? r.sample : ROOT.sample
  });
  const bad = validateData(d);
  if (bad) {
    DATA = null;
    $('v-pick').innerHTML = raceChips() + '<div class="err">' + esc(r.race || (i + 1) + 'R') + ' の内容を確認してください。<br>' + esc(bad) + '</div>';
    show('v-pick');
    return;
  }
  DATA = d;
  MODEL = computeModel(DATA.horses);
  MAPS = buildOddsMaps(DATA);
  PICKS = choosePicks(DATA, MODEL, MAPS);
  SUMMARY = summarize(PICKS, MODEL);
  newSim();
  renderPick();
  show('v-pick');
}

async function boot() {
  try {
    const res = await fetch('race.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    ROOT = await res.json();
  } catch (e) {
    $('v-pick').innerHTML = '<div class="err">race.json を読み込めませんでした。<br>・ファイル名が race.json になっているか<br>・index.html と同じ場所に置いてあるか<br>・GitHub Pages のURLから開いているか（ダブルクリックで開くと読めません）</div>';
    return;
  }
  RACES = (ROOT && Array.isArray(ROOT.races) && ROOT.races.length) ? ROOT.races : [ROOT];
  const m = /r(\d+)/.exec(location.hash);
  let i = m ? parseInt(m[1], 10) - 1 : 0;
  if (!(i >= 0 && i < RACES.length)) i = 0;
  loadRace(i);
}
boot();
</script>
